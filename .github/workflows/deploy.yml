name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The embedding model for semantic search (~23 MB). Keyed on the semantic config, so changing
      # the model or its revision downloads it again.
      - name: Cache search model
        uses: actions/cache@v6
        with:
          path: .cache/models
          key: search-model-${{ hashFiles('src/lib/semantic/config.ts') }}

      # Installs dependencies, runs `npm run build` (type check, Astro build, Pagefind index,
      # semantic search index) and uploads dist/ as the Pages artifact.
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
